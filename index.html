<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple-Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Teko:wght@300..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="main">
      <h1>Simple Calculator</h1>
      <div class="calcy-container">
        <div class="disp-container">
          <input type="text" id="display" placeholder="" disabled>
        </div>
        <div class="btn-container">
        <div class="col-1">
          <div class="row">
            <button id="nine" value="9" onclick="appendToLabel('9')">9</button>
            <button id="eight" value="8" onclick="appendToLabel('8')">8</button>
            <button id="seven" value="7" onclick="appendToLabel('7')">7</button>
            <button id="add" value="+" onclick="appendToLabel('+')">+</button>
          </div>
          <div class="row">
            <button id="six" value="6" onclick="appendToLabel('6')">6</button>
            <button id="five" value="5" onclick="appendToLabel('5')">5</button>
            <button id="four" value="4" onclick="appendToLabel('4')">4</button>
            <button id="substract" value="-" onclick="appendToLabel('-')">-</button>
          </div>
          <div class="row">
            <button id="three" value="3" onclick="appendToLabel('3')">3</button>
            <button id="two" value="2" onclick="appendToLabel('2')">2</button>
            <button id="one" value="1" onclick="appendToLabel('1')">1</button>
            <button id="multipy" value="*" onclick="appendToLabel('*')">*</button>
          </div>
          <div class="row">
            <button id="zero" value="0" onclick="appendToLabel('0')">0</button>
            <button id="reset" value="reset" >ac</button>
            <button id="equal" value="=" onclick="calculate()">=</button>
            <button id="divide" value="/" onclick="appendToLabel('/')">/</button>
          </div>
        </div>
      </div>
    </div>
  </div>
      <script src="index.js"></script>
  </body>
</html>
